name: Node.js CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://umami:ci-only-password@localhost:5432/umami_ci"
  APP_SECRET: ci-only-app-secret
  BASE_DOMAIN: localhost

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: umami
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: umami_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umami -d umami_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to the temporary database
        run: pnpm db:migrate
      - name: Verify migrations are repeatable
        run: pnpm db:migrate
      - run: pnpm openapi:generate
      - run: pnpm openapi:check --explicit
      - run: pnpm check:api:client
      - run: pnpm build:packages
      - run: pnpm test
      - run: pnpm test:packages
      - name: Check application and package types
        run: |
          pnpm --filter @umami/api-client typecheck
          pnpm --filter @umami/mcp typecheck
          pnpm exec tsc --noEmit
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: ci-only-password
      APP_SECRET: ci-only-app-secret
      BASE_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start Enhanced with a temporary database
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check application health
        run: curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/heartbeat
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove CI containers and temporary volume
        if: always()
        run: docker compose down --volumes
